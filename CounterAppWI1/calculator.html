<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Counter App</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .counter-box {
      background: white;
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      width: 300px;
    }

    h1 {
      margin-bottom: 20px;
      color: #333;
    }

    #count {
      font-size: 60px;
      font-weight: bold;
      color: #007bff;
      margin: 20px 0;
    }

    .buttons button {
      padding: 10px 18px;
      margin: 8px;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
      transition: 0.3s;
    }

    .decrease {
      background: #dc3545;
      color: white;
    }

    .reset {
      background: #6c757d;
      color: white;
    }

    .increase {
      background: #28a745;
      color: white;
    }

    .buttons button:hover {
      transform: scale(1.05);
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="counter-box">
    <h1>Counter App</h1>

    <div id="count">0</div>

    <div class="buttons">
      <button class="decrease" onclick="decrease()">-</button>
      <button class="reset" onclick="reset()">Reset</button>
      <button class="increase" onclick="increase()">+</button>
    </div>
  </div>

  <script>
    let count = 0;
    const countDisplay = document.getElementById('count');

    function increase() {
      count++;
      countDisplay.innerText = count;
    }

    function decrease() {
      count--;
      countDisplay.innerText = count;
    }

    function reset() {
      count = 0;
      countDisplay.innerText = count;
    }
  </script>

</body>
</html>
